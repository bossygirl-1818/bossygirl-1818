<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Vaishnavi S - AI Engineer for Software-Defined Vehicles">
<style>
.gl{animation:gl 3.6s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.55}50%{opacity:1}}
.rd{animation:rd 2.4s linear infinite}
@keyframes rd{0%{transform:translateY(0);stroke-width:.4;stroke-opacity:.12}100%{transform:translateY(170px);stroke-width:2.6;stroke-opacity:.85}}
.car{animation:drive 8s linear infinite}
@keyframes drive{0%{transform:translate(1330px,0)}100%{transform:translate(-330px,0)}}
.bob{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.whl{transform-box:fill-box;transform-origin:center;animation:spin .55s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
.tl{animation:tl 1.7s ease-in-out infinite}
@keyframes tl{0%,100%{opacity:.5}50%{opacity:1}}
.cur{animation:cur 1.05s steps(1) infinite}
@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.gl,.rd,.car,.bob,.whl,.tl,.cur{animation:none}}
</style>
<defs>
<filter id="ng" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="sg" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="hz" cx="50%" cy="100%" r="70%"><stop offset="0%" stop-color="#00E5FF" stop-opacity=".38"/><stop offset="45%" stop-color="#00E5FF" stop-opacity=".08"/><stop offset="100%" stop-color="#000000" stop-opacity="0"/></radialGradient>
<linearGradient id="beam" x1="100%" y1="0%" x2="0%" y2="0%"><stop offset="0%" stop-color="#E6FBFF" stop-opacity=".5"/><stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/></linearGradient>
<linearGradient id="trail" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FF2E63" stop-opacity="0"/><stop offset="100%" stop-color="#FF2E63" stop-opacity=".55"/></linearGradient>
<clipPath id="fl"><rect x="0" y="238" width="1200" height="162"/></clipPath>
</defs>

<rect width="1200" height="400" fill="#000000"/>
<ellipse cx="600" cy="248" rx="620" ry="150" fill="url(#hz)"/>

<g clip-path="url(#fl)">
<g stroke="#00E5FF" stroke-linecap="round">
<line class="rd" x1="-260" y1="240" x2="1460" y2="240"/>
<line class="rd" x1="-260" y1="240" x2="1460" y2="240" style="animation-delay:-.4s"/>
<line class="rd" x1="-260" y1="240" x2="1460" y2="240" style="animation-delay:-.8s"/>
<line class="rd" x1="-260" y1="240" x2="1460" y2="240" style="animation-delay:-1.2s"/>
<line class="rd" x1="-260" y1="240" x2="1460" y2="240" style="animation-delay:-1.6s"/>
<line class="rd" x1="-260" y1="240" x2="1460" y2="240" style="animation-delay:-2s"/>
</g>
<g stroke="#0B3A45" stroke-width="1.1">
<line x1="600" y1="240" x2="-460" y2="400"/><line x1="600" y1="240" x2="-160" y2="400"/>
<line x1="600" y1="240" x2="120" y2="400"/><line x1="600" y1="240" x2="340" y2="400"/>
<line x1="600" y1="240" x2="510" y2="400"/><line x1="600" y1="240" x2="690" y2="400"/>
<line x1="600" y1="240" x2="860" y2="400"/><line x1="600" y1="240" x2="1080" y2="400"/>
<line x1="600" y1="240" x2="1360" y2="400"/><line x1="600" y1="240" x2="1660" y2="400"/>
</g>
</g>

<line x1="0" y1="240" x2="1200" y2="240" stroke="#00E5FF" stroke-width="1.4" opacity=".85" filter="url(#sg)"/>

<g class="car">
<g transform="translate(0,296)">
<g class="bob">
<g opacity=".5"><rect x="168" y="18" width="150" height="1.6" fill="url(#trail)"/><rect x="176" y="30" width="190" height="1.6" fill="url(#trail)"/><rect x="172" y="42" width="120" height="1.6" fill="url(#trail)"/></g>
<polygon points="4,26 -128,8 -128,50 4,36" fill="url(#beam)"/>
<g filter="url(#sg)">
<path d="M4 44 L8 34 C16 28 34 26 62 24 L86 11 C96 8 114 7 130 9 C150 12 168 21 179 30 L189 34 C193 36 194 40 194 44 Z" fill="#04141A" stroke="#00E5FF" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M68 23 L89 13 L103 12 L101 23 Z" fill="#00E5FF" opacity=".32"/>
<path d="M110 12 L129 12 C144 15 157 21 165 27 L112 23 Z" fill="#00E5FF" opacity=".32"/>
<circle cx="8" cy="30" r="3.4" fill="#E6FBFF"/>
<circle class="tl" cx="189" cy="31" r="3.4" fill="#FF2E63"/>
</g>
<g stroke="#00E5FF" stroke-width="2.4" fill="#000000">
<g class="whl"><circle cx="52" cy="45" r="12"/><line x1="52" y1="36" x2="52" y2="54" stroke-width="1.6"/><line x1="43" y1="45" x2="61" y2="45" stroke-width="1.6"/></g>
<g class="whl" style="animation-delay:-.2s"><circle cx="152" cy="45" r="12"/><line x1="152" y1="36" x2="152" y2="54" stroke-width="1.6"/><line x1="143" y1="45" x2="161" y2="45" stroke-width="1.6"/></g>
</g>
<ellipse cx="100" cy="60" rx="105" ry="5" fill="#00E5FF" opacity=".16"/>
</g>
</g>
</g>

<g text-anchor="middle" font-family="JetBrains Mono,Fira Code,DejaVu Sans Mono,monospace">
<text class="gl" x="600" y="118" font-size="66" font-weight="700" letter-spacing="14" fill="#E6FBFF" filter="url(#ng)">VAISHNAVI S</text>
<text x="600" y="118" font-size="66" font-weight="700" letter-spacing="14" fill="#E6FBFF">VAISHNAVI S</text>
<text x="600" y="158" font-size="16.5" letter-spacing="5.5" fill="#00E5FF" filter="url(#sg)">AI ENGINEER // SOFTWARE-DEFINED VEHICLES</text>
<text x="600" y="196" font-size="13" letter-spacing="3" fill="#4A6D7C">MULTI-AGENT SYSTEMS &#183; REINFORCEMENT LEARNING &#183; EDGE-CLOUD<tspan class="cur" fill="#00E5FF" dx="6">_</tspan></text>
</g>

<g stroke="#00E5FF" stroke-width="2" fill="none" opacity=".7">
<path d="M22 22 L22 52 M22 22 L52 22"/><path d="M1178 22 L1178 52 M1178 22 L1148 22"/>
<path d="M22 378 L22 348 M22 378 L52 378"/><path d="M1178 378 L1178 348 M1178 378 L1148 378"/>
</g>
</svg>
